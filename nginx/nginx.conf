events {
  worker_connections 1024;
}

http {
  # Таймауты для SSE (Server-Sent Events)
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;

  # Скрываем версию nginx
  server_tokens off;

  # Gzip
  gzip on;
  gzip_types text/plain application/json application/javascript text/css;

  # ─── API Backend ────────────────────────────────────────────────────────────
  server {
    listen 80;
    server_name API_DOMAIN;   # заменить на свой домен, например api.xabarla.kz

    # Максимальный размер загружаемых файлов (для вложений к постам)
    client_max_body_size 50M;

    # SSE endpoint — без буферизации
    location /api/notifications/stream {
      proxy_pass         http://backend:8080;
      proxy_http_version 1.1;
      proxy_set_header   Connection "";
      proxy_buffering    off;
      proxy_cache        off;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Все остальные API запросы
    location / {
      proxy_pass         http://backend:8080;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }
  }

  # ─── HTTPS (включить после получения сертификата через certbot) ─────────────
  # server {
  #   listen 443 ssl;
  #   server_name API_DOMAIN;
  #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
  #   ssl_protocols       TLSv1.2 TLSv1.3;
  #   ...то же что выше...
  # }
}
